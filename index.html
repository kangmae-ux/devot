<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 디벗 정책 및 생태계 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .selected {
            background-color: #3b82f6 !important; /* text-blue-500 */
            color: white !important;
            border-color: #3b82f6 !important;
        }
        .correct {
            background-color: #10b981 !important; /* text-green-500 */
            color: white !important;
            border-color: #10b981 !important;
        }
        .incorrect {
            background-color: #ef4444 !important; /* text-red-500 */
            color: white !important;
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">📚 2026 디벗 정책 이해하기 퀴즈</h1>
            <p class="mt-2 text-blue-100 text-sm">서울공연초등학교 연수 자료 기반</p>
        </div>

        <!-- 메인 콘텐츠 영역 -->
        <div class="p-6 md:p-8 min-h-[400px] flex flex-col relative">
            
            <!-- 시작 화면 -->
            <div id="start-screen" class="flex flex-col items-center justify-center flex-grow text-center">
                <div class="text-6xl mb-4">📱</div>
                <h2 class="text-xl font-semibold mb-4">디벗 정책에 대해 얼마나 알고 계신가요?</h2>
                <p class="text-slate-500 mb-8 max-w-md">이 퀴즈는 디벗 기기의 의미, 운영 방식, 수리/분실 대처법 및 유해 사이트 차단 정책 등을 다룹니다.</p>
                <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-colors">
                    퀴즈 시작하기
                </button>
            </div>

            <!-- 퀴즈 화면 -->
            <div id="quiz-screen" class="hidden flex-col flex-grow">
                <div class="flex justify-between items-center mb-6">
                    <span id="question-counter" class="text-sm font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">문제 1 / 5</span>
                    <span id="score-display" class="text-sm font-bold text-slate-500">점수: 0</span>
                </div>
                
                <h2 id="question-text" class="text-xl font-bold mb-6 leading-relaxed">질문이 여기에 표시됩니다.</h2>
                
                <div id="options-container" class="space-y-3 mb-8">
                    <!-- 옵션 버튼들이 여기에 동적으로 생성됩니다. -->
                </div>

                <div id="feedback-container" class="hidden mb-6 p-4 rounded-lg bg-slate-50 border border-slate-200">
                    <p id="feedback-text" class="text-sm font-medium"></p>
                </div>

                <div class="mt-auto flex justify-end">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                        다음 문제 ➔
                    </button>
                </div>
            </div>

            <!-- 결과 화면 -->
            <div id="result-screen" class="hidden flex-col items-center justify-center flex-grow text-center">
                <div id="result-emoji" class="text-6xl mb-4">🎉</div>
                <h2 class="text-2xl font-bold mb-2">퀴즈 완료!</h2>
                <p class="text-lg text-slate-600 mb-6">총 5문제 중 <span id="final-score" class="font-bold text-blue-600 text-xl">3</span>문제를 맞혔습니다.</p>
                
                <div id="result-message" class="mb-8 p-4 bg-blue-50 text-blue-800 rounded-lg max-w-md">
                    메시지
                </div>

                <button onclick="resetQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-colors">
                    다시 풀기 ↺
                </button>
            </div>
            
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "'디벗'이라는 이름의 의미로 가장 알맞은 것은 무엇인가요?",
                options: [
                    "Digital + 버릇 (올바른 디지털 사용 습관)",
                    "Device + 버전 (최신 기기 활용)",
                    "Digital + 벗 (디지털 기기는 나의 디지털 학습 친구)",
                    "Digital + 버튼 (디지털 기기 조작 능력)"
                ],
                correctAnswer: 2,
                explanation: "디벗은 'Digital + 벗'의 줄임말로, '디지털 기기는 나의 디지털 학습 친구'라는 의미를 담고 있습니다."
            },
            {
                question: "초등학교의 디벗 기기 보관 및 운영 방식에 대한 설명으로 올바른 것은 무엇인가요?",
                options: [
                    "매일 기기를 가정으로 가져가서 직접 충전해야 한다.",
                    "기기를 교실 충전함에 보관하며, 지정 대여받아 졸업할 때까지 사용 후 반납한다.",
                    "매년 학년이 바뀔 때마다 새로운 기기로 교체하여 대여받는다.",
                    "초등학교 졸업 후에는 학생 개인 소유로 완전히 귀속된다."
                ],
                correctAnswer: 1,
                explanation: "초등학교는 기기를 교실 충전함에 보관하고 활용하는 것이 기본이며, 지정 대여받은 기기를 졸업할 때까지 사용하고 반납합니다."
            },
            {
                question: "학생의 개인 과실로 인해 디벗 기기가 고장나거나 파손되었을 때(일반 학생 기준) 수리비 부담 방식은?",
                options: [
                    "수리비의 20%만 부담한다 (최대 4만원을 초과하지 않음).",
                    "파손 즉시 학생이 전액(100%)을 배상해야 한다.",
                    "교육청에서 무조건 100% 무상으로 수리해 준다.",
                    "고장 발생 시 즉시 새 기기로 본인 부담 없이 교체한다."
                ],
                correctAnswer: 0,
                explanation: "개인 과실 수리 시 수리비의 20%(최대 4만원 이하)만 개인이 부담하며, 취약계층은 재학 중 1회에 한해 무상 지원됩니다."
            },
            {
                question: "디벗 기기를 분실했을 경우의 처리 절차와 책임으로 올바른 것은?",
                options: [
                    "학교에서 남은 학기 동안 공용 기기를 무상으로 대여해준다.",
                    "기기 중고거래 방지를 위해 분실 시 학생 부담으로 재구매해야 한다.",
                    "졸업할 때까지 다른 친구의 기기를 함께 사용하도록 지도한다.",
                    "경찰에 신고만 하면 교육청에서 새 기기를 지급한다."
                ],
                correctAnswer: 1,
                explanation: "기기 분실 시 콜센터 등을 통해 위치를 확인하며, 최종 분실 확정 시 중고거래 방지를 위해 학생 부담으로 재구매(일반 10% 할인, 취약계층 50% 할인)해야 합니다."
            },
            {
                question: "디벗 기기의 유해 사이트 및 앱 차단 관리에 대한 설명으로 가장 적절한 것은?",
                options: [
                    "가정에서 사용할 때만 학부모가 직접 차단 앱을 설치해 관리해야 한다.",
                    "학생 스스로의 자율성을 위해 어떠한 사이트 차단도 하지 않는다.",
                    "교육청 일괄 관리만 가능하며, 학교 단위에서의 추가 차단은 불가능하다.",
                    "학교 스쿨넷 등을 통해 기본 차단되며, MDM으로 학교별 추가 차단이 가능하다."
                ],
                correctAnswer: 3,
                explanation: "기본적으로 학교 스쿨넷과 방통위 실시간 DB를 통해 유해 사이트가 차단되며, 학교에서 원할 경우 MDM 정책을 통해 추가로 차단할 수 있습니다."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const nextBtn = document.getElementById('next-btn');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.classList.add('hidden');
            feedbackContainer.classList.add('hidden');
            
            const currentQuizData = quizData[currentQuestion];
            questionText.innerText = currentQuizData.question;
            questionCounter.innerText = `문제 ${currentQuestion + 1} / ${quizData.length}`;
            scoreDisplay.innerText = `점수: ${score}`;
            
            optionsContainer.innerHTML = '';
            
            currentQuizData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 focus:outline-none';
                button.onclick = () => selectOption(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, selectedButton) {
            if (isAnswered) return;
            isAnswered = true;

            const currentQuizData = quizData[currentQuestion];
            const allButtons = optionsContainer.children;

            // 모든 버튼 비활성화
            for(let i=0; i<allButtons.length; i++) {
                allButtons[i].disabled = true;
                allButtons[i].classList.add('opacity-75');
            }

            // 정답 체크
            if (selectedIndex === currentQuizData.correctAnswer) {
                selectedButton.classList.add('correct');
                selectedButton.classList.remove('opacity-75');
                score++;
                showFeedback(true, currentQuizData.explanation);
            } else {
                selectedButton.classList.add('incorrect');
                selectedButton.classList.remove('opacity-75');
                
                // 정답 표시
                allButtons[currentQuizData.correctAnswer].classList.add('correct');
                allButtons[currentQuizData.correctAnswer].classList.remove('opacity-75');
                showFeedback(false, currentQuizData.explanation);
            }

            scoreDisplay.innerText = `점수: ${score}`;
            nextBtn.classList.remove('hidden');
        }

        function showFeedback(isCorrect, explanation) {
            feedbackContainer.classList.remove('hidden');
            feedbackContainer.classList.remove('bg-green-50', 'bg-red-50', 'border-green-200', 'border-red-200');
            
            if(isCorrect) {
                feedbackContainer.classList.add('bg-green-50', 'border-green-200');
                feedbackText.innerHTML = `<span class="text-green-700 font-bold">✅ 정답입니다!</span><br><span class="text-slate-600 mt-1 block">${explanation}</span>`;
            } else {
                feedbackContainer.classList.add('bg-red-50', 'border-red-200');
                feedbackText.innerHTML = `<span class="text-red-700 font-bold">❌ 오답입니다.</span><br><span class="text-slate-600 mt-1 block">${explanation}</span>`;
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.remove('flex');
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('final-score').innerText = score;
            
            const messageEl = document.getElementById('result-message');
            const emojiEl = document.getElementById('result-emoji');
            
            if (score === quizData.length) {
                emojiEl.innerText = '🏆';
                messageEl.innerHTML = '<strong>완벽합니다!</strong><br>디벗 정책과 생태계를 완벽하게 이해하고 계시네요!';
                messageEl.className = 'mb-8 p-4 bg-green-50 text-green-800 rounded-lg max-w-md';
            } else if (score >= 3) {
                emojiEl.innerText = '👍';
                messageEl.innerHTML = '<strong>잘하셨어요!</strong><br>전반적인 디벗 정책을 잘 숙지하고 있습니다.';
                messageEl.className = 'mb-8 p-4 bg-blue-50 text-blue-800 rounded-lg max-w-md';
            } else {
                emojiEl.innerText = '📖';
                messageEl.innerHTML = '<strong>조금 더 확인이 필요해요.</strong><br>자료를 다시 한번 읽어보시면 큰 도움이 될 거예요.';
                messageEl.className = 'mb-8 p-4 bg-orange-50 text-orange-800 rounded-lg max-w-md';
            }
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            resultScreen.classList.remove('flex');
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startScreen.classList.add('flex');
        }
    </script>
</body>
</html>
